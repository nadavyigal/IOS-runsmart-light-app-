# Adds the 'sensitive' label. Matching ANY file below marks the PR sensitive.
# TODO-verify: run `git ls-files | grep -Ei '<keyword>'` for each name glob and tune.
sensitive:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'AGENTS.md'
          - 'CLAUDE.md'
          - 'CODEX.md'
          - 'CURSOR.md'
          - 'scripts/check_migrations.py'
          - '**/*CoachLink*'
          - '**/*Session*'
          - '**/CoachMode/**'
          - '**/*.pbxproj'
          - 'supabase/**'
          - 'fastlane/**'
          - 'ExportOptions*.plist'
          - 'scripts/verify-release-backend.py'
          - 'scripts/deploy-coach-message.sh'
          - '**/*.entitlements'
          - '**/*.xcconfig'
          - '**/*.xcconfig.example'
          - 'RunSmartInfo.plist'
          - 'RunSmartRunLiveActivityExtension-Info.plist'
          - '**/*.xcprivacy'
          - '**/*Auth*'
          - '**/*Keychain*'
          - '**/*Secret*'
          - '**/*Token*'
          - '**/*APIBaseURL*'
          - '**/*StoreKit*'
          - '**/*Purchase*'
          - '**/*Subscription*'
          - '**/*Entitlement*'
          - '**/*Paywall*'
          - '**/*Location*'
          - '**/*HealthKit*'
          - '**/*Route*'
          - '**/*Strava*'
          - '**/*Garmin*'
          - '**/*Privacy*'
          - '**/*Consent*'
          - '**/*DeleteAccount*'
